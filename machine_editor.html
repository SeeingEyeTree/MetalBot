<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine Editor</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;--text:#c9d1d9;--dim:#8b949e;--blue:#1f6feb;--green:#2ea043;--amber:#d29922;--red:#f85149;--purple:#a371f7}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:12px "Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--dim)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.success{background:var(--green);border-color:var(--green);color:#fff}
button.danger{color:var(--red)}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.sm{padding:1px 6px;font-size:11px}
#toolbar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
#toolbar .sp{flex:1}
#fname{color:var(--dim)}
#main{flex:1;display:flex;min-height:0}
#left{width:300px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel)}
#center{flex:1;position:relative;min-width:300px;overflow:hidden}
#right{width:380px;border-left:1px solid var(--border);background:var(--panel);overflow:auto;padding:10px}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:6px}
.tabs button.on{background:var(--panel2);box-shadow:inset 0 -2px var(--blue);color:var(--text)}
#lbody{flex:1;overflow:auto;padding:6px}
.card{padding:6px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;margin-bottom:6px;cursor:grab}
.card:hover{border-color:var(--blue)}
.card b{display:block}
.card .intent{color:var(--dim);font-size:11px;max-height:3.2em;overflow:hidden}
.mini{display:flex;height:6px;border-radius:2px;overflow:hidden;margin:3px 0;background:#0006}
.mini div{height:100%}
.chip{display:inline-block;padding:0 6px;border-radius:8px;font-size:10px;background:#0006;border:1px solid var(--border);margin-right:3px;color:var(--dim)}
.dim{color:var(--dim);font-size:11px}
h3{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
h3:first-child{margin-top:0}
label{display:block;margin:6px 0 2px;color:var(--dim)}
input[type=text],input[type=number],select,textarea{width:100%}
textarea{min-height:60px;resize:vertical}
#svg{width:100%;height:100%;display:block;background:radial-gradient(#21262d 1px,transparent 1px) 0 0/22px 22px}
.node rect.body{fill:var(--panel2);stroke:var(--border);stroke-width:1.5}
.node.sel rect.body{stroke:var(--blue);stroke-width:2.5}
.node.cur rect.body{stroke:var(--amber);stroke-width:3}
.node.bad rect.body{stroke:var(--red)}
.node text{fill:var(--text);pointer-events:none}
.node .sub{fill:var(--dim);font-size:10px}
.node .handle{fill:var(--blue);stroke:#fff;stroke-width:1.5;cursor:crosshair}
.node .start{fill:var(--green);font-size:9px;font-weight:700}
.edge path{fill:none;stroke:#6e7681;stroke-width:2}
.edge.sel path{stroke:var(--blue);stroke-width:3}
.edge.hit path{stroke:var(--amber);stroke-width:3.5}
.edge.any path{stroke-dasharray:6 4;stroke:var(--purple)}
path.hitarea{stroke:transparent!important;stroke-width:14!important;stroke-dasharray:none!important;cursor:pointer;fill:none}
.edge text{fill:var(--text);font-size:10px;pointer-events:none}
.edge rect.lbl{fill:var(--panel);stroke:var(--border);rx:3}
.edge.sel rect.lbl{stroke:var(--blue)}
#always{position:absolute;left:8px;right:8px;top:6px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
#always .chip{pointer-events:auto;border-style:dashed;cursor:pointer;background:var(--panel)}
#hint{position:absolute;left:10px;bottom:8px;color:var(--dim);font-size:11px;pointer-events:none}
.group{border-left:2px solid var(--blue);padding:4px 0 4px 8px;margin:4px 0}
.group.foc{border-left-color:var(--amber)}
.group .gh{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.leaf{display:grid;grid-template-columns:1.6fr 54px 1fr auto auto;gap:4px;align-items:center;margin:3px 0}
.leaf.bool{grid-template-columns:1.6fr 1fr auto auto}
.sig{padding:3px 6px;border-bottom:1px solid var(--border);cursor:pointer}
.sig:hover{background:var(--panel2)}
.sig b{color:var(--text)}
.sig.cross b{color:var(--purple)}
#sigs{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:4px;margin-top:4px}
.prob{padding:3px 6px;border-bottom:1px solid var(--border);cursor:pointer}
.prob.e{color:var(--red)}.prob.w{color:var(--amber)}
.rule{padding:6px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;margin-bottom:6px}
.rule b{display:block}
.rule .k{color:var(--dim)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
#modal .box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px;width:min(820px,92vw);max-height:88vh;overflow:auto}
#modal textarea{min-height:140px;font-family:Consolas,monospace;font-size:11px}
#toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:6px 12px;border-radius:4px;display:none;z-index:20}
</style>
<script src="machine_editor/lua_table.js"></script>
<script src="stance_editor/machine_index.js" onerror="window.MACHINE_INDEX=null"></script>
</head>
<body>
<div id="toolbar">
  <b>Machine Editor</b>
  <button id="bNew">New</button>
  <button id="bOpen">Open .lua</button>
  <button id="bSave" class="success">Save</button>
  <button id="bSaveAs">Save as…</button>
  <span id="fname"></span>
  <span class="sp"></span>
  <button id="bUndo">Undo</button><button id="bRedo">Redo</button>
  <button id="bLayout">Auto-layout</button>
  <button id="bFit">Fit</button>
  <button id="bValidate">Validate</button>
  <button id="bReplay">Replay log</button>
  <button id="bHelp">?</button>
</div>
<div id="main">
  <div id="left">
    <div class="tabs"><button id="tStance" class="on">Stance machine</button><button id="tShare">Army-share machine</button></div>
    <div class="tabs"><button id="lPal" class="on">Palette</button><button id="lRules">Built-in rules</button></div>
    <div id="lbody"></div>
  </div>
  <div id="center">
    <svg id="svg"><defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6e7681"/></marker>
      <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f6feb"/></marker>
      <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a371f7"/></marker>
    </defs><g id="vp"><g id="edges"></g><g id="nodes"></g><g id="labels"></g><g id="tmp"></g></g></svg>
    <div id="always"></div>
    <div id="hint">drag a stance in · drag from a node's blue dot to another node to add a transition · click an arrow to edit its conditions · wheel zooms, drag empty space pans</div>
  </div>
  <div id="right"></div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const NS = "http://www.w3.org/2000/svg";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));

// ------------------------------------------------------------------ data
let IDX = window.MACHINE_INDEX || { stances: [], signals: [], builtin_rules: [], units: {} };
const SIG = () => Object.fromEntries(IDX.signals.map((s) => [s.name, s]));
const STANCE = () => Object.fromEntries(IDX.stances.map((s) => [s.name, s]));
const HOOKS = { match_enemy: { ratio: 1.1, expect: 0.5, unscouted: 0.35, floor: 0.2 }, v16_share: { floor: 0.2 } };
const KEYS = { stance: "stance_machine", share: "share_machine" };

function blank() {
  return { name: "new_machine", version: 1,
    stance_machine: { initial: null, nodes: {}, edges: [], any_edges: [] },
    share_machine: { initial: null, nodes: {}, edges: [], any_edges: [] } };
}
let D = { header: "", spec: blank() };
let tab = "stance";
let sel = null;                 // { kind: "node", id } | { kind: "edge", list, i } | { kind: "any" }
let view = { x: 40, y: 40, k: 1 };
let fileHandle = null, fileName = "";
let undo = [], redo = [];
let hl = null;                  // replay highlight { node, list, i }
let focusPath = [];             // condition builder: the group new conditions go into
let ctree = null;               // the selected edge's condition, as an editable tree

const M = () => {
  const m = D.spec[KEYS[tab]] || (D.spec[KEYS[tab]] = { initial: null, nodes: {}, edges: [], any_edges: [] });
  if (Array.isArray(m.nodes)) m.nodes = {};
  m.edges = m.edges || []; m.any_edges = m.any_edges || [];
  return m;
};
const fix = () => { for (const k of ["stance_machine", "share_machine"]) { const m = D.spec[k]; if (m) { if (Array.isArray(m.nodes)) m.nodes = {}; m.edges = m.edges || []; m.any_edges = m.any_edges || []; } } };

function snap() { undo.push(JSON.stringify(D.spec)); if (undo.length > 100) undo.shift(); redo = []; }
function restore(s) { D.spec = JSON.parse(s); fix(); sel = null; ctree = null; renderAll(); persist(); }
function persist() { try { localStorage.setItem("machineEditor", JSON.stringify({ D, tab, fileName })); } catch (e) { /* private window */ } }
function toast(t) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (e.style.display = "none"), 2600); }

// ------------------------------------------------------------------ conditions: spec <-> editable tree
function toTree(c) {
  if (!c) return { type: "group", mode: "all", neg: false, kids: [] };
  if (c.not) { const t = toTree(c.not); t.neg = !t.neg; return t; }
  if (c.all || c.any) return { type: "group", mode: c.all ? "all" : "any", neg: false, kids: (c.all || c.any).map(toTree) };
  return { type: "leaf", sig: c.sig, op: c.op || "", val: c.val, neg: false };
}
function fromTree(t) {
  let c;
  if (t.type === "group") {
    const kids = t.kids.map(fromTree);
    if (!kids.length) return null;
    c = (kids.length === 1 && !t.neg) ? kids[0] : { [t.mode]: kids };
    if (kids.length === 1 && t.neg) c = { not: kids[0] };
    else if (t.neg) c = { not: c };
    return c;
  }
  c = { sig: t.sig }; if (t.op) { c.op = t.op; c.val = t.val; }
  return t.neg ? { not: c } : c;
}
function condText(c) {
  if (!c) return "always";
  if (c.all || c.any) { const p = (c.all || c.any).map(condText); const s = p.join(c.all ? " AND " : " OR "); return p.length > 1 ? "(" + s + ")" : s; }
  if (c.not) return "NOT " + condText(c.not);
  return c.op ? `${c.sig} ${c.op} ${c.val}` : c.sig;
}
function getAt(path) { let t = ctree; for (const i of path) t = t.kids[i]; return t; }

// ------------------------------------------------------------------ selection helpers
const edgeOf = (s) => (s.list === "any_edges" ? M().any_edges[s.i] : M().edges[s.i]);
function selEdge() { return sel && sel.kind === "edge" ? edgeOf(sel) : null; }
function select(s) {
  sel = s; ctree = null; focusPath = [];
  const e = selEdge(); if (e) ctree = toTree(e.when);
  renderCanvas(); renderRight();
}
function commitCond() { const e = selEdge(); if (!e) return; const c = fromTree(ctree); if (c) e.when = c; else delete e.when; renderCanvas(); persist(); }

// ------------------------------------------------------------------ geometry / canvas
const NW = 210;
function nodeH(nd) { return tab === "stance" ? 88 : 66; }
const ANYPOS = () => { const m = M(); if (!m.any_pos) m.any_pos = { x: -40, y: -10 }; return m.any_pos; };
function anyRect() { const p = ANYPOS(); return { x: p.x, y: p.y, w: 110, h: 34 }; }
function rectOf(id) {
  if (id === "*") return anyRect();
  const nd = M().nodes[id]; if (!nd) return null;
  return { x: nd.x || 0, y: nd.y || 0, w: NW, h: nodeH(nd) };
}
const center = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
function clip(r, from, to) {
  const c = center(r), dx = to.x - c.x, dy = to.y - c.y;
  const sx = dx === 0 ? Infinity : (r.w / 2 + 4) / Math.abs(dx), sy = dy === 0 ? Infinity : (r.h / 2 + 4) / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: c.x + dx * s, y: c.y + dy * s };
}
function colorFor(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 55% 52%)`; }
const ARMY = { raid: "#f85149", hold: "#58a6ff", defend: "#3fb950", perimeter: "#d29922", maneuver: "#a371f7" };

function renderCanvas() {
  const m = M();
  $("#vp").setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
  const S = STANCE();
  let eh = "", nh = "", lh = "";
  // pair offsets so parallel / opposite edges do not overlap
  const pairs = {};
  const all = [];
  m.edges.forEach((e, i) => all.push({ e, i, list: "edges", from: e.from }));
  m.any_edges.forEach((e, i) => all.push({ e, i, list: "any_edges", from: "*" }));
  for (const a of all) { const k = [a.from, a.e.to].sort().join("|"); (pairs[k] = pairs[k] || []).push(a); }
  for (const a of all) {
    const R1 = rectOf(a.from), R2 = rectOf(a.e.to);
    if (!R1 || !R2) continue;
    const k = [a.from, a.e.to].sort().join("|"), grp = pairs[k], idx = grp.indexOf(a);
    const off = (idx - (grp.length - 1) / 2) * 46 + (a.from > a.e.to && grp.length > 1 ? 0 : 0);
    const c1 = center(R1), c2 = center(R2);
    const mx = (c1.x + c2.x) / 2, my = (c1.y + c2.y) / 2;
    const dx = c2.x - c1.x, dy = c2.y - c1.y, len = Math.hypot(dx, dy) || 1;
    const sign = a.from < a.e.to ? 1 : -1;
    const cp = { x: mx + (-dy / len) * off * sign + (grp.length === 1 ? 0 : 0), y: my + (dx / len) * off * sign };
    const p1 = clip(R1, c1, cp), p2 = clip(R2, c2, cp);
    const lx = 0.25 * p1.x + 0.5 * cp.x + 0.25 * p2.x, ly = 0.25 * p1.y + 0.5 * cp.y + 0.25 * p2.y;
    const txt = condText(a.e.when), meta = [a.e.hold_s ? `hold ${a.e.hold_s}s` : "", a.e.min_stay_s ? `stay ${a.e.min_stay_s}s` : "", a.e.prio ? `p${a.e.prio}` : ""].filter(Boolean).join(" ");
    const label = (txt.length > 36 ? txt.slice(0, 35) + "…" : txt) + (meta ? "  · " + meta : "");
    const w = label.length * 5.3 + 10;
    const isSel = sel && sel.kind === "edge" && sel.list === a.list && sel.i === a.i;
    const isHit = hl && hl.list === a.list && hl.i === a.i;
    const d = `M${p1.x},${p1.y} Q${cp.x},${cp.y} ${p2.x},${p2.y}`;
    const cls = `edge ${a.list === "any_edges" ? "any" : ""} ${isSel ? "sel" : ""} ${isHit ? "hit" : ""}`;
    eh += `<g class="${cls}" data-list="${a.list}" data-i="${a.i}"><path d="${d}" marker-end="url(#${isSel ? "arrS" : a.list === "any_edges" ? "arrA" : "arr"})"/><path class="hitarea" d="${d}"/></g>`;
    lh += `<g class="${cls}" data-list="${a.list}" data-i="${a.i}" style="cursor:pointer"><rect class="lbl" x="${lx - w / 2}" y="${ly - 9}" width="${w}" height="18"/><text x="${lx}" y="${ly + 4}" text-anchor="middle">${esc(label)}</text></g>`;
  }
  for (const [id, nd] of Object.entries(m.nodes)) {
    const r = rectOf(id);
    const st = tab === "stance" ? S[nd.stance] : null;
    const bad = tab === "stance" && !st && IDX.stances.length;
    const isSel = sel && sel.kind === "node" && sel.id === id;
    let body = `<text x="10" y="18" font-weight="700" font-size="13">${esc(id)}</text>`;
    if (tab === "stance") {
      body += `<text class="sub" x="10" y="33">${esc(nd.stance === id ? "" : nd.stance || "?")}${bad ? " — stance not found" : ""}</text>`;
      if (st) {
        let x = 10; const tot = st.units.reduce((a, u) => a + (u.share || 0), 0) || 1;
        for (const u of st.units) { const w = (u.share / tot) * (NW - 20); body += `<rect x="${x}" y="42" width="${Math.max(w - 1, 0)}" height="8" fill="${colorFor(u.n)}"><title>${esc(IDX.units[u.n] || u.n)} ${(100 * u.share).toFixed(0)}%</title></rect>`; x += w; }
        const army = st.plan && st.plan.army;
        body += `<text class="sub" x="10" y="68">${army ? `<tspan fill="${ARMY[army] || "#8b949e"}">● ${esc(army)}</tspan>  ` : ""}share ${esc(st.share || "?")}%${st.plan && st.plan.share ? " floor " + Math.round(st.plan.share * 100) + "%" : ""}</text>`;
      }
    } else if (nd.hook) {
      body += `<text class="sub" x="10" y="33">hook: ${esc(nd.hook)}</text>`;
      body += `<text class="sub" x="10" y="50">${esc(Object.entries(nd.cfg || {}).map(([k, v]) => k + "=" + v).join(" ").slice(0, 36))}</text>`;
    } else {
      const sh = nd.share || 0;
      body += `<text class="sub" x="10" y="33">fixed ${Math.round(sh * 100)}%${nd.ramp_s ? " · ramp " + nd.ramp_s + "s" : ""}</text>`;
      body += `<rect x="10" y="42" width="${NW - 20}" height="8" fill="#0006"/><rect x="10" y="42" width="${(NW - 20) * Math.min(1, sh)}" height="8" fill="#58a6ff"/>`;
    }
    const isStart = m.initial === id;
    nh += `<g class="node ${isSel ? "sel" : ""} ${bad ? "bad" : ""} ${hl && hl.node === id ? "cur" : ""}" data-id="${esc(id)}" transform="translate(${r.x} ${r.y})">
      <rect class="body" width="${r.w}" height="${r.h}" rx="6"/>${body}${isStart ? `<text class="start" x="${NW - 38}" y="14">START</text>` : ""}
      <circle class="handle" cx="${r.w}" cy="${r.h / 2}" r="7"/></g>`;
  }
  // the "from any state" pseudo node
  if (m.any_edges.length || (sel && sel.kind === "any")) {
    const r = anyRect(), isSel = sel && sel.kind === "any";
    nh += `<g class="node ${isSel ? "sel" : ""}" data-id="*" transform="translate(${r.x} ${r.y})"><rect class="body" width="${r.w}" height="${r.h}" rx="17" style="stroke-dasharray:5 3"/>
      <text x="${r.w / 2}" y="21" text-anchor="middle" style="fill:#a371f7">from any state</text><circle class="handle" cx="${r.w}" cy="${r.h / 2}" r="7"/></g>`;
  }
  $("#edges").innerHTML = eh; $("#nodes").innerHTML = nh; $("#labels").innerHTML = lh;
}

// pointer handling
let drag = null;
function toWorld(ev) { const r = $("#svg").getBoundingClientRect(); return { x: (ev.clientX - r.left - view.x) / view.k, y: (ev.clientY - r.top - view.y) / view.k }; }
$("#svg").addEventListener("mousedown", (ev) => {
  const g = ev.target.closest(".node"), eg = ev.target.closest(".edge");
  if (g && ev.target.classList.contains("handle")) {
    drag = { kind: "link", from: g.dataset.id }; ev.preventDefault(); return;
  }
  if (g) {
    const id = g.dataset.id, w = toWorld(ev);
    if (id === "*") { select({ kind: "any" }); const p = ANYPOS(); drag = { kind: "move", id, dx: w.x - p.x, dy: w.y - p.y, snapped: false }; }
    else { select({ kind: "node", id }); const nd = M().nodes[id]; drag = { kind: "move", id, dx: w.x - (nd.x || 0), dy: w.y - (nd.y || 0), snapped: false }; }
    ev.preventDefault(); return;
  }
  if (eg) { select({ kind: "edge", list: eg.dataset.list, i: +eg.dataset.i }); return; }
  select(null);
  drag = { kind: "pan", sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y };
});
window.addEventListener("mousemove", (ev) => {
  if (!drag) return;
  if (drag.kind === "pan") { view.x = drag.vx + ev.clientX - drag.sx; view.y = drag.vy + ev.clientY - drag.sy; renderCanvas(); }
  else if (drag.kind === "move") {
    if (!drag.snapped) { snap(); drag.snapped = true; }
    const w = toWorld(ev), x = Math.round((w.x - drag.dx) / 10) * 10, y = Math.round((w.y - drag.dy) / 10) * 10;
    if (drag.id === "*") Object.assign(ANYPOS(), { x, y }); else Object.assign(M().nodes[drag.id], { x, y });
    renderCanvas();
  } else if (drag.kind === "link") {
    const r = rectOf(drag.from), p = center(r), w = toWorld(ev);

    el("button", { class: "sm", onclick: () => { snap(); t.kids.push({ type: "group", mode: "any", neg: false, kids: [] }); focusPath = path.concat([t.kids.length - 1]); window.__drawCond(); } }, "+ group"),
    path.length ? el("button", { class: "sm danger", onclick: () => { snap(); getAt(path.slice(0, -1)).kids.splice(path[path.length - 1], 1); focusPath = []; commitCond(); window.__drawCond(); } }, "✕") : null);
  const g = el("div", { class: "group" + (foc ? " foc" : "") }, head, ...t.kids.map((k, i) => condUI(k, path.concat([i]))));
  if (!t.kids.length) g.append(el("div", { class: "dim" }, path.length ? "empty group (ignored)" : "no condition: always true. Click a signal below."));
  return g;
}

// ------------------------------------------------------------------ validation
function problems() {
  const out = [], S = SIG(), ST = STANCE();
  for (const key of ["stance", "share"]) {
    const m = D.spec[KEYS[key]]; if (!m) continue;
    const L = (s) => `${key}: ${s}`;
    if (!m.initial || !m.nodes[m.initial]) out.push({ lv: "e", t: L("no valid initial node"), key });
    for (const [id, nd] of Object.entries(m.nodes)) {
      if (key === "stance" && IDX.stances.length && !ST[nd.stance]) out.push({ lv: "e", t: L(`node ${id}: stance '${nd.stance}' not found`), key, node: id });
      if (key === "share" && nd.share == null && !nd.hook) out.push({ lv: "e", t: L(`node ${id}: no share and no hook`), key, node: id });
      if (key === "share" && nd.hook && !HOOKS[nd.hook]) out.push({ lv: "e", t: L(`node ${id}: unknown hook ${nd.hook}`), key, node: id });
      if (!m.edges.some((e) => e.from === id) && Object.keys(m.nodes).length > 1) out.push({ lv: "w", t: L(`node ${id} has no exit (stays forever once entered)`), key, node: id });
    }
    const chk = (e, list, i) => {
      if (!m.nodes[e.to]) out.push({ lv: "e", t: L(`${list}[${i + 1}] goes to missing node '${e.to}'`), key, list, i });
      if (list === "edges" && !m.nodes[e.from]) out.push({ lv: "e", t: L(`${list}[${i + 1}] comes from missing node '${e.from}'`), key, list, i });
      const walk = (c) => { if (!c) return; if (c.all || c.any) (c.all || c.any).forEach(walk); else if (c.not) walk(c.not); else if (c.sig && !S[c.sig] && IDX.signals.length) out.push({ lv: "e", t: L(`${list}[${i + 1}]: unknown signal '${c.sig}'`), key, list, i }); };
      walk(e.when);
      if (!e.when) out.push({ lv: "w", t: L(`${list}[${i + 1}] has no condition (fires immediately)`), key, list, i });
    };
    m.edges.forEach((e, i) => chk(e, "edges", i)); m.any_edges.forEach((e, i) => chk(e, "any_edges", i));
    for (const id of Object.keys(m.nodes)) { const es = m.edges.filter((e) => e.from === id); const seen = {}; for (const e of es) { const p = e.prio || 0; if (seen[p]) out.push({ lv: "w", t: L(`node ${id}: two exits share prio ${p} (the first listed wins)`), key, node: id }); seen[p] = 1; } }
    if (m.initial && m.nodes[m.initial]) {
      const seen = new Set([m.initial]), q = [m.initial]; for (const e of m.any_edges) if (!seen.has(e.to)) { seen.add(e.to); q.push(e.to); }
      while (q.length) { const n = q.pop(); for (const e of m.edges) if (e.from === n && !seen.has(e.to)) { seen.add(e.to); q.push(e.to); } }
      for (const id of Object.keys(m.nodes)) if (!seen.has(id)) out.push({ lv: "w", t: L(`node ${id} is unreachable`), key, node: id });
    }
  }
  return out;
}
function renderProblems(R) {
  const ps = problems();
  R.append(el("h3", {}, "Checks"));
  if (!ps.length) R.append(el("div", { class: "dim", style: "color:var(--green)" }, "No problems found."));
  for (const p of ps) R.append(el("div", { class: "prob " + p.lv, onclick: () => { if (p.key !== tab) setTab(p.key); if (p.node) select({ kind: "node", id: p.node }); else if (p.list) select({ kind: "edge", list: p.list, i: p.i }); } }, (p.lv === "e" ? "✖ " : "⚠ ") + p.t));
}

// ------------------------------------------------------------------ files
async function openFile() {
  try {
    if (window.showOpenFilePicker) {
      const [h] = await showOpenFilePicker({ types: [{ description: "Lua machine", accept: { "text/x-lua": [".lua"] } }] });
      const f = await h.getFile(); load(await f.text(), f.name, h);
    } else {
      const inp = el("input", { type: "file", accept: ".lua", onchange: async () => { const f = inp.files[0]; if (f) load(await f.text(), f.name, null); } }); inp.click();
    }
  } catch (e) { if (e.name !== "AbortError") toast("Open failed: " + e.message); }
}
function load(text, name, handle) {
  try {
    const { header, value } = LuaTable.parseLua(text);
    if (!value || typeof value !== "object") throw new Error("file does not return a table");
    snap(); D = { header, spec: value }; fix();
    if (!D.spec.stance_machine) D.spec.stance_machine = blank().stance_machine;
    if (!D.spec.share_machine) D.spec.share_machine = blank().share_machine;
    fileHandle = handle; fileName = name; sel = null; ctree = null; hl = null;
    layoutMissing(); fitView(); renderAll(); persist(); toast("Opened " + name);
  } catch (e) { toast("Could not read " + name + ": " + e.message); }
}
function layoutMissing() {
  for (const key of ["stance_machine", "share_machine"]) {
    const m = D.spec[key]; let i = 0;
    for (const nd of Object.values(m.nodes)) { if (nd.x == null) { nd.x = 100 + (i % 3) * 300; nd.y = 100 + Math.floor(i / 3) * 150; } i++; }
  }
}
async function save(as) {
  const text = LuaTable.serializeLua(D.spec, D.header);
  try {
    if (window.showSaveFilePicker) {
      if (as || !fileHandle) fileHandle = await showSaveFilePicker({ suggestedName: (D.spec.name || "machine") + ".lua", types: [{ description: "Lua machine", accept: { "text/x-lua": [".lua"] } }] });
      const w = await fileHandle.createWritable(); await w.write(text); await w.close();
      fileName = fileHandle.name; renderFile(); toast("Saved " + fileName + " (put it in machines/ and run deploy)");
    } else {
      const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "text/plain" })), download: (D.spec.name || "machine") + ".lua" }); a.click();
      toast("Downloaded — move it into machines/");
    }
  } catch (e) { if (e.name !== "AbortError") toast("Save failed: " + e.message); }
  persist();
}
function renderFile() { $("#fname").textContent = fileName || "(unsaved)"; }

// ------------------------------------------------------------------ replay
function modal(html, nodes) { const b = $("#mbox"); b.innerHTML = html || ""; if (nodes) b.append(...nodes); $("#modal").style.display = "flex"; }
$("#modal").addEventListener("mousedown", (ev) => { if (ev.target.id === "modal") { $("#modal").style.display = "none"; } });
function replay() {
  const ta = el("textarea", { placeholder: "paste the game log (or just its [FSM] lines)…" });
  const out = el("div");
  const go = () => {
    out.innerHTML = "";
    const ev = [];
    for (const ln of ta.value.split("\n")) {
      const mm = /\[FSM\]\s+(stance|share)\s+(\d+:\d+)\s+(\S+)\s+->\s+(\S+)\s+\|\s+(edge|any_edge)\s+(\d+)\s+\|\s*(.*)/.exec(ln);
      if (mm) ev.push({ machine: mm[1], t: mm[2], from: mm[3], to: mm[4], list: mm[5] === "edge" ? "edges" : "any_edges", i: +mm[6] - 1, why: mm[7] });
    }
    if (!ev.length) { out.append(el("div", { class: "dim" }, "No [FSM] transition rows found. (Rows look like `[FSM] stance 4:01 hold -> raid | edge 1 | …`.)")); return; }
    out.append(el("div", { class: "dim" }, ev.length + " transitions. Click one to show it on the graph."));
    for (const e of ev) out.append(el("div", { class: "prob", onclick: () => { if (e.machine !== tab) setTab(e.machine); hl = { node: e.to, list: e.list, i: e.i }; renderCanvas(); $("#modal").style.display = "none"; toast(`${e.t} ${e.from} → ${e.to}`); } }, `${e.t}  [${e.machine}] ${e.from} → ${e.to}   ${e.why}`));
  };
  modal("<h3>Replay a game log</h3>", [ta, el("div", { style: "margin:6px 0" }, el("button", { class: "primary", onclick: go }, "Read log"), " ", el("button", { onclick: () => { hl = null; renderCanvas(); } }, "Clear highlight")), out]);
}
function help() {
  modal(`<h3>Machine Editor</h3><div style="line-height:1.55">
  <p>A <b>machine</b> decides <i>when</i> the bot changes. The <b>stance machine</b> picks the active stance (unit mix + army behaviour); the <b>army-share machine</b> picks how much of income goes to army. Both run once a second in CORE.</p>
  <p>Drag stances in from the left. Drag from a node's blue dot to another node to make a transition; click the arrow and build its condition from signals with AND / OR / NOT. The machines read each other through signals (<code>stance</code>, <code>share</code> …), so the share can depend on the stance.</p>
  <p>Files are plain Lua in <code>machines/</code>; CORE loads <code>CFG.MACHINE</code> (<code>candidates/CORE/macro_controller.lua</code>). Run <code>python fsm_index.py</code> after adding stances or signals; <code>python fsm_index.py --check</code> validates machine files. Game logs show transitions as <code>[FSM] stance m:ss a -> b | edge N | values</code>.</p>
  <p>Keys: Del removes the selection · Ctrl+Z / Ctrl+Y undo / redo · Ctrl+S saves · wheel zooms · drag background pans.</p></div>`);
}

// ------------------------------------------------------------------ wiring
function setTab(t) { tab = t; sel = null; ctree = null; hl = null; renderAll(); fitView(); renderCanvas(); persist(); }
function renderAll() { renderLeft(); renderCanvas(); renderRight(); renderAlways(); renderFile(); }
$("#tStance").onclick = () => setTab("stance"); $("#tShare").onclick = () => setTab("share");
$("#lPal").onclick = () => { lmode = "pal"; renderLeft(); }; $("#lRules").onclick = () => { lmode = "rules"; renderLeft(); };
$("#bNew").onclick = () => { if (!confirm("Start a new empty machine? (Undo can bring the old one back.)")) return; snap(); D = { header: "", spec: blank() }; fileHandle = null; fileName = ""; sel = null; renderAll(); persist(); };
$("#bOpen").onclick = openFile; $("#bSave").onclick = () => save(false); $("#bSaveAs").onclick = () => save(true);
$("#bUndo").onclick = doUndo; $("#bRedo").onclick = doRedo; $("#bLayout").onclick = autoLayout;
$("#bFit").onclick = () => { fitView(); renderCanvas(); };
$("#bValidate").onclick = () => { select(null); toast(problems().length + " finding(s) — see the right panel"); };
$("#bReplay").onclick = replay; $("#bHelp").onclick = help;

(function init() {
  try { const s = JSON.parse(localStorage.getItem("machineEditor") || "null"); if (s && s.D && s.D.spec) { D = s.D; tab = s.tab || "stance"; fileName = s.fileName || ""; fix(); } } catch (e) { /* ignore */ }
  if (!IDX.stances.length) toast("No machine_index.js — run `python fsm_index.py` in the repo and reload (stance and signal lists are empty)");
  renderAll(); fitView(); renderCanvas();
  if (!Object.keys(M().nodes).length) toast("Open machines/core_default.lua to start from CORE's rules");
})();
</script>
